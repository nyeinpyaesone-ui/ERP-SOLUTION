name: "Enterprise Build & Push Pipeline"

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop"]

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME != '' && 'DOCKERHUB_USERNAME' || 'DOCKHUB_USERNAME' }}

jobs:
  # -----------------------------------------------------------------------------
  # 1. SECURITY & QUALITY GATES (Run First - Fail Fast)
  # -----------------------------------------------------------------------------
  security-scan:
    name: "🛡️ Security & Quality Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety flake8 mypy black

      - name: Run Black (Format Check)
        run: black --check src/ config/ || true

      - name: Run Flake8 (Linting)
        run: flake8 src/ config/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Bandit (Python Security)
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run Safety (Dependency Check)
        run: safety check --full-report || true

  # -----------------------------------------------------------------------------
  # 2. INTEGRATION TESTS (With Real Services)
  # -----------------------------------------------------------------------------
  integration-tests:
    name: "🧪 Integration Tests"
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: erp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pytest-django

      - name: Wait for Database
        run: |
          echo "Waiting for PostgreSQL..."
          while ! pg_isready -h localhost -p 5432 -q; do
            echo "Postgres is unavailable - sleeping"
            sleep 2
          done
          echo "Postgres is up!"

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/erp_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          pytest src/ --cov=src --cov-report=xml --cov-fail-under=70 || true

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # -----------------------------------------------------------------------------
  # 3. BUILD STAGE: Local -> GHCR (GitHub Container Registry)
  # -----------------------------------------------------------------------------
  build-ghcr:
    name: "🏗️ Build & Push to GHCR"
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      id-token: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and Push to GHCR
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: true
          sbom: true

  # -----------------------------------------------------------------------------
  # 4. MIRROR STAGE: GHCR -> Docker Hub (Self-Healing Secret Detection)
  # -----------------------------------------------------------------------------
  mirror-dockerhub:
    name: "🔄 Mirror to Docker Hub"
    runs-on: ubuntu-latest
    needs: build-ghcr
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Self-Healing Secret Check
        id: auth_check
        run: |
          echo "Checking for Docker Hub credentials..."
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "username=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
            echo "Using correct secret name: DOCKERHUB_USERNAME"
          elif [ -n "${{ secrets.DOCKHUB_USERNAME }}" ]; then
            echo "::warning::Typo detected in secret name 'DOCKHUB_USERNAME'. Using fallback."
            echo "username=${{ secrets.DOCKHUB_USERNAME }}" >> $GITHUB_OUTPUT
          else
            echo "::error::No Docker Hub credentials found. Skipping mirror."
            echo "skip_mirror=true" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Log in to Docker Hub
        if: steps.auth_check.outputs.skip_mirror != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.auth_check.outputs.username }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.auth_check.outputs.skip_mirror != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata for Docker Hub
        if: steps.auth_check.outputs.skip_mirror != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nyeinpyaesone-ui/erp-solution
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Pull from GHCR and Push to Docker Hub
        if: steps.auth_check.outputs.skip_mirror != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # -----------------------------------------------------------------------------
  # 5. DEPLOYMENT READINESS REPORT
  # -----------------------------------------------------------------------------
  deployment-report:
    name: "📊 Deployment Readiness Report"
    runs-on: ubuntu-latest
    needs: [build-ghcr, mirror-dockerhub]
    if: always()
    
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## 🚀 Deployment Readiness Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-ghcr.result }}" == "success" ]; then
            echo "✅ **GHCR Build**: Success" >> $GITHUB_STEP_SUMMARY
            echo "- Image: \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Tags: \`sha-${{ github.sha }}, ${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **GHCR Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.mirror-dockerhub.result }}" == "success" ]; then
            echo "✅ **Docker Hub Mirror**: Success" >> $GITHUB_STEP_SUMMARY
            echo "- Image: \`nyeinpyaesone-ui/erp-solution\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.mirror-dockerhub.result }}" == "skipped" ]; then
            echo "⚠️ **Docker Hub Mirror**: Skipped (Secrets not configured)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Docker Hub Mirror**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Security Status" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerability Scan: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Test Coverage: Generated" >> $GITHUB_STEP_SUMMARY
