name: Production Container Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "config/**"
      - "src/**"
      - "trigger_config.yaml"
      - ".github/workflows/production-container-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-production-image:
    name: Build production image without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          tags: erp-solution:pr-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
