name: DevContainer Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "config/settings/development.py"
      - "requirements*.txt"
      - "src/**"
      - "tests/**"
      - "pytest.ini"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "config/settings/development.py"
      - "requirements*.txt"
      - "src/**"
      - "tests/**"
      - "pytest.ini"

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-devcontainer:
    name: Build and validate development environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f .devcontainer/compose.yaml config --quiet

      - name: Build DevContainer app image
        run: docker compose -f .devcontainer/compose.yaml build app

      - name: Start PostgreSQL and Redis
        run: docker compose -f .devcontainer/compose.yaml up -d db redis

      - name: Verify services, migrations, Django checks and tests
        env:
          WAIT_TIMEOUT_SECONDS: "120"
        run: |
          docker compose -f .devcontainer/compose.yaml run --rm app bash -lc '
            bash .devcontainer/scripts/wait-for-services.sh
            python -m pip install --no-cache-dir -r requirements-dev.txt
            python src/manage.py migrate --noinput
            python src/manage.py check
            DJANGO_SETTINGS_MODULE=config.settings.test python -m pytest
          '

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f .devcontainer/compose.yaml logs --no-color

      - name: Stop services
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down --volumes --remove-orphans
