[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# libtmux ships a pytest plugin that applies marks to fixtures, which is
# fatal under pytest >= 8. It is an unrelated transitive dependency, so
# disable its auto-loaded plugin here (single source of truth for pytest).
addopts =
    -p no:libtmux
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
    --strict-markers
    --tb=short
    -v

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

testpaths = tests
