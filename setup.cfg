[flake8]
max-line-length = 100
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    venv,
    .venv,
    */migrations/*,
    */static/*
ignore = E203, W503

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = -v --tb=short --cov=src --cov-report=html --cov-report=term-missing
norecursedirs = node_modules dist build .git __pycache__

[coverage:run]
source = src
omit = 
    */migrations/*
    */tests/*
    */__pycache__/*
    */static/*
    setup.py
    manage.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
