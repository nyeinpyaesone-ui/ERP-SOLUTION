[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    venv,
    .venv,
    */migrations/*,
    */static/*
ignore = E203, W503
per-file-ignores =
    # Settings modules intentionally extend base settings via star-imports;
    # F405 (undefined from star import) is expected and safe there.
    config/settings/*:F405,F403

# NOTE: pytest configuration lives in pytest.ini (single source of
# truth). A duplicate [tool:pytest] section here previously conflicted with it.

[coverage:run]
source = src
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */static/*
    setup.py
    manage.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
